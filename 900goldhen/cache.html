<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<title>BERKS PLAYSTATION PS4</title>
<link rel="stylesheet" href="../style.css">
<!-- WhatsApp və TikTok İkonları İçin Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    background-image: url('m2foto/img.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #000;
    color: #ffffff;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Mərkəzi Kart Alanı - Blur sıfırdır, logo net görünür */
  .card-container {
    border: 2px solid rgba(255, 0, 0, 0.8);
    border-radius: 16px;
    padding: 20px 30px;
    width: 85%;
    max-width: 800px;
    background: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
  }

  /* Başlıq və Sayğaclar */
  .brand-title {
    font-size: 20px;
    margin: 0 0 15px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: nowrap;
    gap: 10px;
  }

  .counter-success {
    color: #25d366;
    white-space: nowrap;
  }

  .counter-fail {
    color: #ff4d4d;
    white-space: nowrap;
  }

  .main-title {
    color: #ff0000;
    white-space: nowrap;
  }

  .social-container {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 17px;
  }

  .social-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ff4d4d;
    text-shadow: 0 0 10px #ff0000;
  }

  .fa-whatsapp { color: #25d366; font-size: 20px; }
  .fa-tiktok { color: #ff0050; font-size: 20px; }
  .white-text { color: #ffffff; text-shadow: 0 0 10px #fff; }

  #msgs {
    font-size: 22px;
    color: #ffffff;
    margin: 20px 0 10px 0;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 10px #000, 0 0 20px #000;
  }
</style>
</head>
<body>

<script>
history.replaceState(null,null,'index.html');
var histlength=history.length;
history.go(-histlength);

function DLProgress(e){
  Percent=(Math.round(e.loaded / e.total * 100));
  setTimeout(function(){
    window.msgs.innerHTML="Oflayn Keş Yüklənir: " + Percent + "%";
  },500);
}

function DisplayCacheProgress(){
  setTimeout(function(){
    window.msgs.innerHTML="Keş Uğurla Yükləndi ✔";
  },1500);
  setTimeout(function(){
    window.msgs.innerHTML="İndi Səhifəni Bağlayıb Yenidən Açın...";
  },3500);
}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>

<div class="card-container">
  <div class="brand-title">
    <span class="counter-success">Uğurlu = <span id="passCounter">0</span></span>
    <span class="main-title">BERKS PLAYSTATION <span class="white-text">PS4</span></span>
    <span class="counter-fail">Xəta = <span id="failCounter">0</span></span>
  </div>

  <div class="social-container">
    <div class="social-item">
      Oyunlarin Yazilmasi 099 740 79 39 <i class="fa-brands fa-whatsapp"></i>
    </div>
    <div class="social-item">
      <i class="fa-brands fa-tiktok"></i> tempesst34
    </div>
  </div>

  <hr style="border-color: rgba(255, 0, 0, 0.6); margin: 15px 0;">

  <div id="msgs">Zəhmət Olmasa Gözləyin...</div>
</div>

<script>
if (localStorage.passcount == null) localStorage.passcount = 0;
window.passCounter.innerHTML = localStorage.passcount;
if (localStorage.failcount == null) localStorage.failcount = 0;
window.failCounter.innerHTML = localStorage.failcount;
</script>

</body>
</html>
