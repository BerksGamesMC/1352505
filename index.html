<!DOCTYPE html>

<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    background-image: url('img.png');
    background-size: contain;

    color: #ffffff;

  .card-container {

    border-radius: 16px;
    padding: 25px 20px;
    width: 90%;

    background: rgba(0, 0, 0, 0.15);
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
  }

  /* Kalın Başlık */
  .brand-title {
    font-size: 32px;
    font-weight: bold;
    color: #ff1a1a;

    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #000;
    margin: 0 0 10px 0;
  }

  /* PS4 Yazısını Beyaz Yapan Sınıf */
  .white-text {
    color: #ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 30px #000;
  }

  /* Kalın Sosyal Media / İletişim */
  .social-item {
    font-size: 18px;
    font-weight: bold;
    color: #ff4d4d;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ff0000, 0 0 15px #000;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .social-item i {
    font-size: 20px;
  }

  .fa-whatsapp {
    color: #25d366;
  }

  .fa-tiktok {
    color: #ff0050;
  }

  /* Kalın Mesaj Alanı */
  #msgs {
    font-size: 17px;
    font-weight: bold;
    color: #ffffff;
    margin: 15px 0;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 10px #000, 0 0 20px #000;
  }

  /* Düymələrin Qutusu */
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    margin: 15px 0;
  }

  /* Kalın Butonlar */
  .main-link {
    display: block;
    width: 100%;
    max-width: 320px;
    padding: 14px 20px;
    color: #ffffff;
    background-color: rgba(255, 0, 0, 0.4);
    border: 3px solid #ff0000;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    text-shadow: 0 0 8px #000;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
    transition: all 0.3s ease;
  }

  .main-link:hover {
    background-color: #ff0000;
    color: #000;
    box-shadow: 0 0 35px rgba(255, 0, 0, 1);
  }

  /* Kalın Alt Yazı */
  .footer-text {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
    color: #ff6666;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #000;
  }
</style>
</head>
<body>

<script>
// Tarixçəni təmizləyib oflayn keş sistemi üçün hazırlamaq
var histlength = history.length;
history.go(-histlength + 2);

// Oflayn Keş Yükləmə Funksiyaları
function DLProgress(e){
  Percent = (Math.round(e.loaded / e.total * 100));
  document.getElementById("msgs").innerHTML = "Oflayn Keş Yüklənir: " + Percent + "%";
}

function DisplayCacheProgress(){
  document.getElementById("msgs").innerHTML = "Keş Uğurla Yükləndi ✔ (Oflayn İşləyir)";
}

if (window.applicationCache) {
  window.applicationCache.addEventListener("progress", DLProgress, false);
  window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
  window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
}
</script>
