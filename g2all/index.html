<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>PS4 GoldHEN Host - Berks PlayStation</title>
<link rel="stylesheet" href="../style.css">
<!-- Google Ninja Fontu Eklendi -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shojumaru&display=swap" rel="stylesheet">

<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    background-color: #000000;
    /* Görselinizin tam yolu tanımlandı */
    background-image: url('../m2foto/img.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    color: #ffffff;
    font-family: 'Shojumaru', cursive, Arial, sans-serif;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Şeffaf Kırmızı Neon Kart Paneli */
  .card-container {
    border: 2px solid rgba(255, 0, 0, 0.7);
    border-radius: 16px;
    padding: 30px 20px;
    width: 90%;
    max-width: 500px;
    background: rgba(0, 0, 0, 0.25);
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  /* Kırmızı Neon Başlık (Ninja Fontu) */
  .brand-title {
    font-family: 'Shojumaru', cursive;
    font-size: 32px;
    font-weight: bold;
    color: #ff1a1a;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #000;
    margin: 0 0 10px 0;
  }

  /* Neon Mesaj / Yükleniyor Alanı (Ninja Fontu) */
  .neon-status {
    font-family: 'Shojumaru', cursive;
    font-size: 20px;
    color: #ff4d4d;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ff0000, 0 0 15px #000;
    margin: 30px 0;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Alt Kısım Telif Yazısı */
  .footer-text {
    font-family: 'Shojumaru', cursive;
    margin-top: 20px;
    font-size: 14px;
    color: #ff6666;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #000;
  }
</style>
</head>
<body>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Bilinmir";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Məzmun Tapılmadı! - Səyahətçi datalarını təmizləyin və Keşi yenidən quraşdırın...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Yalnız Versiyası 5.05 və 7.00 - 13.52 arası olan PS4 konsolları üçündür";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Dəstəklənməyən Versiya: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<div class="card-container">
  <h1 class="brand-title">BERKS PLAYSTATION</h1>
  <hr style="border-color: rgba(255, 0, 0, 0.4); margin-bottom: 20px;">

  <!-- Azerbaycan dilinde mesaj alanı -->
  <h1 id="msgs" class="neon-status">GoldHEN v2.4b18.12 Yüklənir... Zəhmət olmasa gözləyin</h1>

  <div class="footer-text">Berks PlayStation 2026 ©</div>
</div>

</body>
</html>
